syntax = "proto3";

package gitspace.plugin;

option go_package = "github.com/ssotops/gitspace-plugin-sdk/proto";

message PluginInfo {
    string name = 1;
    string version = 2;
}

message PluginInfoRequest {}

message CommandRequest {
    string command = 1;
    map<string, string> parameters = 2;
}

message CommandResponse {
    bool success = 1;
    string result = 2;
    string error_message = 3;
    NavigationContext navigation = 4;
    ProgressUpdate progress = 5;  // Add progress field
}

message MenuRequest {}

message MenuItem {
    string label = 1;
    string command = 2;
    string submenu_id = 3;
    repeated ParameterInfo parameters = 4;
}

message MenuResponse {
    bytes menu_data = 1;
}

message NavigationContext {
    string current_menu = 1;
    string parent_menu = 2;
    repeated MenuItem available_commands = 3;
}

message ParameterInfo {
    string name = 1;
    string description = 2;
    bool required = 3;
}

service PluginService {
    rpc GetPluginInfo(PluginInfoRequest) returns (PluginInfo) {}
    rpc ExecuteCommand(CommandRequest) returns (CommandResponse) {}
    rpc GetMenu(MenuRequest) returns (MenuResponse) {}
}

message ProgressUpdate {
    string phase = 1;
    string step = 2;
    string status = 3;  // "running", "success", "error"
    string message = 4;
    string timestamp = 5;
}
